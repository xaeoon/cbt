<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>컴활 2급 스프레드시트 문제풀이</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--tx:#1b2420;--mu:#66726c;--ac:#1d7a4b;--bd:#dde4e0;--no:#c0392b;--nb:#fdecea;--sel:#e3f3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e8eeea;--mu:#93a29a;--ac:#4fc08a;--bd:#2c3833;--no:#ef7a6c;--nb:#3a1f1c;--sel:#1d3a2c}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e8eeea;--mu:#93a29a;--ac:#4fc08a;--bd:#2c3833;--no:#ef7a6c;--nb:#3a1f1c;--sel:#1d3a2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.q{font-weight:600;white-space:pre-wrap;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt.on{border-color:var(--ac);background:var(--sel)}
.btn{padding:12px 18px;border-radius:10px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:16px;cursor:pointer}
.btn.p{background:var(--ac);color:#fff}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.score{text-align:center}
.score b{font-size:52px;color:var(--ac);display:block}
.score b.f{color:var(--no)}
.w{border-left:4px solid var(--no)}
.ex{background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:14px;white-space:pre-wrap}
.tag{display:inline-block;background:var(--nb);color:var(--no);border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[
["다음 중 =ROUNDDOWN(20/3, 2)의 결과값은?",["6.65","6.66","6.67","6.667"],1,"ROUNDDOWN은 올림 없이 버림입니다. 6.6666…을 소수 2자리까지 남기고 버리면 6.66."],
["워크시트에서 [D10]에 '이선동'의 금액 평균을 계산하는 수식으로 적합하지 않은 것은?\n(1행은 제목 / A열 판매자, D열 금액: 2행 이선동 80,000, 3행 김숙희 90,000, 4행 강민지 58,500, 5행 유현아 92,400, 6행 이선동 99,000, 7행 김숙희 40,500, 8행 신미경 106,400)",["=AVERAGE(D2, D6)","=AVERAGEIF(A2:A8, A2, D2:D8)","=SUMIF(A2:A8, A2, D2:D8)/COUNTIF(A2:A8, A2)","=DAVERAGE(A1:D8, D1, A2)"],3,"DAVERAGE의 조건 인수는 필드명을 포함한 범위(예: A1:A2)여야 하는데 A2 한 칸만 지정해 부적합합니다. 나머지는 모두 (80,000+99,000)/2 = 89,500."],
["워크시트의 내용을 인쇄하려 한다. 설명 중 옳지 않은 것은?",["인쇄 영역을 용지 수직 방향 가운데 배치: [페이지 레이아웃]→[페이지 설정]→[여백]→[사용자 지정 여백]","임의 위치에서 페이지 나누기: [페이지 레이아웃]→[페이지 설정]→[나누기]→[페이지 나누기 삽입]","선택한 영역, 선택한 시트, 전체 통합 문서를 인쇄할 수 있다","모든 페이지에 제목행 표시: [페이지 설정] 대화상자의 [인쇄] 탭 선택"],3,"반복할 제목행은 [페이지 설정]의 [시트] 탭에서 지정합니다."],
["고급 필터의 조건 지정 방법에 대한 설명으로 옳지 않은 것은?",["조건 첫 행에는 원본 목록의 필드명을 입력하고 그 아래 행에 조건을 입력한다","만능 문자(*, ?)를 사용하여 추출할 수 있다","조건을 입력하는 행의 위치에 따라 AND 또는 OR로 구분할 수 있다","AND와 OR 조건을 결합하려면 두 번 걸쳐 고급 필터를 실행하면 된다"],3,"AND와 OR 조건은 조건 범위에 함께 배치해 한 번에 추출할 수 있습니다."],
["다음 중 텍스트 나누기에 대한 설명으로 옳지 않은 것은?",["한 셀에 입력된 데이터를 여러 셀로 분리시킬 수 있다","[데이터]→[데이터 도구]→[텍스트 나누기]를 클릭하면 [텍스트 마법사]가 실행된다","필드 사이에 두 가지 이상의 문자 구분 기호가 있으면 텍스트 나누기를 실행할 수 없다","탭, 세미콜론, 쉼표, 공백 등의 구분 기호가 기본으로 제공된다"],2,"구분 기호를 여러 개 동시에 선택해 나눌 수 있습니다."],
["다음 중 [틀 고정]에 대한 설명으로 옳지 않은 것은?",["셀 포인터 이동과 상관없이 항상 제목 행이나 제목 열을 표시하고자 할 때 설정한다","틀 고정은 인쇄 시에는 적용되지 않는다","제목 행으로 설정된 행은 셀 포인터를 화면 아래쪽으로 이동해도 항상 화면에 표시된다","틀 고정을 취소할 때는 셀 포인터를 틀 고정된 우측 하단에 반드시 위치시키고 [보기]→[창]→[틀 고정]→[틀 고정 취소]를 선택해야 한다"],3,"틀 고정 취소는 셀 포인터 위치와 상관없이 가능합니다."],
["다음 중 매크로에 관한 설명으로 옳지 않은 것은?",["매크로 이름은 자동으로 부여되지만 변경할 수 있다","매크로를 기록하려면 [홈]→[코드]→[매크로 기록]을 실행한다","[매크로 기록] 대화상자에서 매크로 이름, 바로 가기 키, 저장할 문서를 지정한다","매크로는 개인용 매크로 통합 문서, 새 통합 문서, 현재 통합 문서 중 하나에 저장한다"],1,"매크로 기록은 [개발 도구]→[코드]→[매크로 기록](또는 [보기]→[매크로])입니다. [홈] 탭에는 코드 그룹이 없습니다."],
["총판매액이 2,500,000원이 되게 하기 위해 판매량이 얼마나 되어야 하는지 알아보기 위해 사용하는 기능으로 옳은 것은?",["부분합","피벗 테이블","데이터 통합","목표값 찾기"],3,"결과값을 정해 두고 필요한 입력값을 역으로 구할 때는 목표값 찾기입니다."],
["엑셀에서 셀에 데이터를 입력할 경우에 관한 설명으로 잘못된 것은?",["데이터를 입력하기 시작하면 수식 입력줄에 입력하는 내용이 나타난다","수치 데이터 입력 중 숫자를 누르고 다른 셀을 클릭하면 클릭한 셀 주소가 입력 중인 셀에 입력된다","데이터 입력 중 수식 입력줄의 입력 단추(✓)를 클릭하면 입력이 완료된다","입력 후 Enter를 누르거나 마우스로 다른 셀을 클릭하면 입력이 완료된다"],1,"셀 주소가 입력되는 것은 '='로 시작하는 수식 입력 중일 때뿐입니다. 일반 수치는 다른 셀을 클릭하면 입력이 완료됩니다."],
["워크시트에서 셀의 선택과 범위 지정 방법에 대한 설명으로 가장 옳지 못한 것은?",["셀의 위치에 관계없이 [A1] 셀로 빠르게 이동하려면 Ctrl+Home을 누른다","연속되지 않은 여러 셀을 선택할 경우 Ctrl을 누른 상태에서 해당 셀을 클릭한다","연속된 여러 셀을 선택할 경우에는 Shift를 누른 채 마우스를 드래그해야 한다","행이나 열 단위로 범위를 지정할 경우 행 머리글이나 열 머리글을 이용해 선택한다"],2,"연속 범위는 그냥 드래그하거나 Shift+클릭으로 선택하므로, 'Shift를 누른 채 드래그해야 한다'는 표현이 옳지 않습니다."],
["하나 이상의 셀에 입력된 데이터를 범위로 설정하여 다른 위치로 복사하고자 할 때의 방법으로 옳지 않은 것은?",["리본 메뉴에서 '복사'를 마우스로 클릭한다","원본 셀의 경계선을 Shift를 누른 채 복사할 위치로 끈다","Ctrl+C를 누른다","원본 셀을 마우스 오른쪽 버튼으로 클릭하여 팝업 메뉴에서 [복사]를 선택한다"],1,"경계선 드래그로 복사하려면 Ctrl을 누른 채 끕니다. Shift를 누르면 삽입 이동입니다."],
["다음 중 엑셀의 인쇄에 관한 설명으로 옳지 않은 것은?",["워크시트의 일부만 인쇄 영역으로 설정할 수 있다","인쇄되는 시작 페이지의 번호를 지정할 수 있다","눈금선, 행/열 머리글 등을 인쇄하도록 설정할 수 있다","[기본] 보기 상태에서 페이지 구분선과 페이지 번호가 나타난다"],3,"페이지 번호는 [기본] 보기에 나타나지 않습니다. [페이지 나누기 미리 보기]나 [페이지 레이아웃] 보기에서 확인합니다."],
["차트에 문자열을 삽입(추가)하는 과정을 설명한 것 중 잘못된 것은?",["[차트 디자인]→[차트 레이아웃]→[차트 요소 추가]로 차트 제목, 가로 축 제목 등을 지정할 수 있다","데이터 계열이 하나일 때 해당 계열의 이름이 자동으로 차트의 제목이 된다","차트 제목, 가로-세로 축 제목, 범례 등을 추가하거나 문자열을 수정할 수 있다","삽입된 제목은 대화상자를 이용하지 않고도 천천히 더블클릭하여 그 위치에서 직접 수정할 수 있다"],3,"제목을 직접 수정하려면 '천천히 두 번 클릭'해야 합니다. 더블클릭하면 서식 창이 열립니다."],
["다음 중 '인쇄 미리 보기' 상태에서 할 수 없는 작업은?",["문서의 상·하·좌·우 여백을 지정할 수 있다","문서 내용을 인쇄할 수 있다","셀의 너비를 늘리거나 줄일 수 있다","인쇄 대상에서 그림 개체를 제외할 수 있다"],3,"미리 보기에서는 여백 표시로 열 너비 조절까지 가능하지만, 그림 개체의 인쇄 제외는 개체 속성에서 설정합니다."],
["다음 중 매크로를 작성할 때의 과정으로 옳지 않은 것은?",["매크로 작성을 종료하려면 [개발 도구]→[코드]→[기록 중지]를 클릭한다","매크로 이름의 첫 글자는 반드시 문자여야 한다","매크로를 바로 가기 키로 실행하려면 매크로 작성 시 바로 가기 키를 지정해 줘야 한다","매크로를 절대 주소 기준으로 작성하려면 [개발 도구]→[코드]→[절대 참조로 기록]을 클릭한다"],3,"'절대 참조로 기록' 메뉴는 없습니다. 기본이 절대 참조 기록이며, 상대 기준일 때만 [상대 참조로 기록]을 클릭합니다."],
["다음은 산술 연산자를 포함하는 수식의 입력에 대한 설명이다. 잘못된 것은? ('=' 없이 입력한 경우)",["[A1]에 3*8을 입력하면 문자열 3*8로 표시된다","[A1]에 3-8을 입력하면 문자열 3-8로 표시된다","[A1]에 3^8을 입력하면 문자열 3^8로 표시된다","[A1]에 3+8을 입력하면 문자열 3+8로 표시된다"],1,"'3-8'은 날짜(3월 8일)로 인식되어 날짜 형식으로 표시됩니다."],
["워크시트에 특수 문자를 입력하는 방법으로 옳은 것은?",["[삽입]→[텍스트]→[특수 문자]를 사용하여 입력한다","영문 입력 상태에서 대문자를 입력하고 한자 키를 누르면 목록이 나타난다","ㄱ, ㄴ, ㄷ 등 한글 자음을 입력한 후 한자 키를 눌러서 입력한다","Ctrl+F10을 누른 후 특수 문자를 선택한다"],2,"한글 자음을 입력하고 한자 키를 누르면 특수 문자 목록이 나타납니다. 메뉴로는 [삽입]→[기호]를 사용합니다."],
["다음 중 정렬에 대한 설명으로 옳지 않은 것은?",["정렬 기준은 최대 64개까지 지정할 수 있다","글꼴 색 또는 셀 색을 기준으로 정렬할 수 있다","병합된 셀들은 맨 아래쪽으로 정렬된다","숨겨진 행이나 열에 있는 데이터는 정렬에 포함되지 않는다"],2,"병합된 셀은 크기가 서로 다르면 정렬되지 않습니다. 맨 아래로 정렬되는 것은 빈 셀입니다."],
["현재 셀에서 Shift+Tab을 누르면 셀 포인터는 어느 방향으로 이동되는가?",["왼쪽으로","오른쪽으로","위쪽으로","아래쪽으로"],0,"Tab은 오른쪽, Shift+Tab은 왼쪽으로 이동합니다."],
["다음 중 열 너비를 조절하는 방법에 대한 설명으로 잘못된 것은?",["열 머리글을 드래그하여 범위를 지정한 상태에서 열의 경계선을 더블클릭하면 선택한 모든 열의 너비가 동일하게 변경된다","열 머리글의 우측 경계선을 마우스로 드래그하여 임의로 너비를 조절할 수 있다","[홈]→[셀]→[서식]→[열 너비]를 선택하여 수치를 직접 입력할 수 있다","열 머리글에서 마우스 오른쪽 버튼을 누르고 [열 너비]를 선택한다"],0,"경계선 더블클릭은 동일 너비가 아니라 각 열의 내용에 맞춘 '자동 맞춤'입니다."],
["[찾기 및 바꾸기]로 만능 문자(*, ?) 자체를 찾는 방법은?",["찾으려는 만능 문자 앞, 뒤에 작은따옴표(' ')를 입력한다","찾으려는 만능 문자 앞에 달러($) 기호를 입력한다","찾으려는 만능 문자 앞에 물결표(~) 기호를 입력한다","찾으려는 만능 문자 앞에 느낌표(!) 기호를 입력한다"],2,"만능 문자 앞에 ~를 붙입니다. (예: ~*)"],

["'다른 이름으로 저장' 대화상자에서 [도구]→[일반 옵션] 메뉴로 설정할 수 없는 것은?",["백업 파일 항상 만들기","열기/쓰기 암호 설정","읽기 전용 권장","통합 문서 공유"],3,"[일반 옵션]에는 통합 문서 공유 항목이 없습니다."],
["서식이 #,##0.00으로 지정된 셀에 데이터 값 -0.386이 입력되었을 때 실제로 나타나는 결과값은?",["-0.386","-0.39","-0.38","-0.00"],1,"소수 2자리까지 표시되므로 셋째 자리에서 반올림되어 -0.39."],
["다음은 워크시트의 이름을 변경하는 방법과 관련된 설명이다. 잘못 설명한 것은?",["시트의 이름은 한글과 영문만 가능하다","시트 탭의 이름을 더블클릭하면 이름을 수정할 수 있는 상태가 된다","시트 이름에 : / ? * ₩ 등의 기호는 사용할 수 없다","'시트' 탭에서 마우스 오른쪽 버튼을 클릭한 후 '이름 바꾸기'를 선택하면 이름을 수정할 수 있는 상태가 된다"],0,"숫자와 일부 특수문자도 사용할 수 있습니다. 단, : / ? * \\ [ ] 는 불가합니다."],
["38.386을 입력한 다음에 자릿수 줄임 단추(.00→.0)를 두 번 눌렀을 때의 결과값은?",["38.4","38.39","38.40","38.0"],0,"한 번 누르면 38.39, 두 번 누르면 38.4로 반올림되어 표시됩니다."],
["다음 중 수식의 결과가 다른 셋과 다른 것은?",["=MID(\"컴퓨터활용능력\", SEARCH(\"S\", \"Sunsign\"), 5)","=LEFT(\"컴퓨터활용능력\", SEARCH(\"s\", \"Sunsign\")+4)","=RIGHT(\"컴퓨터활용능력\", FIND(\"s\", \"Sunsign\"))","=MID(\"컴퓨터활용능력\", FIND(\"S\", \"Sunsign\"), 5)"],2,"SEARCH는 대소문자를 구분하지 않아 위치 1, FIND는 구분하므로 \"S\"는 1, \"s\"는 4입니다. ③만 RIGHT(…, 4)로 '활용능력', 나머지는 모두 '컴퓨터활용'."],
["다음은 매크로를 작성한 후 실행하기 위한 방법에 대한 설명이다. 옳지 않은 것은?",["매크로 작성 시 지정한 바로 가기 키를 이용하여 실행한다","[개발 도구]→[코드]→[매크로]를 이용하여 실행한다","양식 컨트롤의 단추를 만들고 해당 매크로를 지정한 후 실행한다","[파일]→[옵션]→[고급] 탭에서 작성한 매크로를 빠른 실행 도구 모음에 추가하여 실행한다"],3,"빠른 실행 도구 모음 추가는 [옵션]의 '빠른 실행 도구 모음' 탭에서 합니다."],
["데이터 입력에 대한 다음 설명 중 틀린 것은?",["숫자 앞에 인용 부호(')를 붙이면 문자열로 인식한다","현재 시스템의 오늘 시간을 자동 입력하려면 Ctrl+Shift+;를 누른다","문자열은 셀의 왼쪽에 맞춰 정렬되며, 셀 내에서 강제로 줄 바꿈을 하려면 Ctrl+Enter를 누른다","키보드에 없는 특수 문자는 한글의 자음과 한자 키를 이용하여 입력할 수 있다"],2,"셀 내 강제 줄 바꿈은 Alt+Enter입니다."]
];
const A=document.getElementById("app"),N="①②③④";
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let L=[],i=0;
function start(n){
 L=shuf(Q).slice(0,n).map(x=>{const o=shuf([0,1,2,3]);return{q:x[0],o:o.map(k=>x[1][k]),a:o.indexOf(x[2]),e:x[3],s:-1}});
 i=0;quiz();
}
function home(){
 A.innerHTML=`<h1>📊 컴활 2급 · 스프레드시트</h1><p class="mu">2과목 문제은행 ${Q.length}문제 · 문제와 보기 순서가 매번 랜덤으로 섞여요.</p>
 <div class="card"><div class="row" style="flex-direction:column"><button class="btn p" onclick="start(20)">20문제 풀기 (실전 분량)</button><button class="btn" onclick="start(${Q.length})">전체 ${Q.length}문제 풀기</button></div></div>`;
}
function quiz(){
 const x=L[i],n=L.length;
 A.innerHTML=`<div class="mu">${i+1} / ${n}</div><div class="bar"><i style="width:${(i+1)/n*100}%"></i></div>
 <div class="card"><div class="q">${i+1}. ${esc(x.q)}</div>${x.o.map((t,k)=>`<button class="opt ${x.s===k?"on":""}" onclick="pick(${k})">${N[k]} ${esc(t)}</button>`).join("")}</div>
 <div class="row"><button class="btn" onclick="go(-1)" ${i?"":"disabled"}>이전</button>${i<n-1?`<button class="btn p" onclick="go(1)">다음</button>`:`<button class="btn p" onclick="submit()">제출하기</button>`}</div>`;
 window.scrollTo(0,0);
}
function pick(k){L[i].s=k;quiz()}
function go(d){i+=d;quiz()}
function submit(){
 const un=L.filter(x=>x.s<0).length;
 if(un&&!confirm(`풀지 않은 문제가 ${un}개 있어요. 그래도 제출할까요?`))return;
 const wrong=L.map((x,k)=>({...x,no:k+1})).filter(x=>x.s!==x.a);
 const c=L.length-wrong.length,pt=Math.round(c/L.length*100);
 A.innerHTML=`<div class="card score"><div>${L.length}문제 중 ${c}문제 정답</div><b class="${pt<60?"f":""}">${pt}점</b>
 <div class="mu">${pt>=60?"합격 기준(60점) 이상이에요 🎉":"합격 기준은 60점이에요. 해설 보고 다시 도전!"}</div>
 <div class="row" style="justify-content:center"><button class="btn p" onclick="start(L.length)">다시 풀기(새로 섞기)</button><button class="btn" onclick="home()">처음으로</button></div></div>
 ${wrong.length?`<h3>틀린 문제 ${wrong.length}개</h3>`:`<div class="card">전부 맞혔어요! 🎯</div>`}
 ${wrong.map(x=>`<div class="card w"><span class="tag">오답</span><div class="q">${x.no}. ${esc(x.q)}</div>
 <div>내 답: <b>${x.s<0?"(미응답)":N[x.s]+" "+esc(x.o[x.s])}</b></div><div>정답: <b>${N[x.a]} ${esc(x.o[x.a])}</b></div>
 <div class="ex">💡 ${esc(x.e)}</div></div>`).join("")}`;
 window.scrollTo(0,0);
}
home();
</script>
